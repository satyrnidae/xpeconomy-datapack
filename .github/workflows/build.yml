name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The game side checks of npm run check need the 26.3 client jar and a local harness, so only these run here
      - name: Build datapack
        run: npm run build

      - name: Check formulas and uninstall
        run: |
          node src/scripts/check_formula.mjs
          node src/scripts/check_uninstall.mjs

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./mcb.config.js').settings.version")" >> "$GITHUB_OUTPUT"

      # pack.mcmeta and data/ sit at the top of the zip, which is what the datapacks folder expects
      - name: Zip datapack
        run: zip -r "experience_economy_${{ steps.version.outputs.version }}.zip" pack.mcmeta data LICENSE

      - name: Zip resource pack
        working-directory: resourcepack
        run: zip -r "../experience_economy_resourcepack_${{ steps.version.outputs.version }}.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: experience_economy_${{ steps.version.outputs.version }}
          path: experience_economy_${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: experience_economy_resourcepack_${{ steps.version.outputs.version }}
          path: experience_economy_resourcepack_${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

  # Runs on a v* tag only. The tag may carry a prerelease suffix, v0.2.0-rc.1, and its version before the suffix has to match
  # mcb.config.js. A suffix makes it a prerelease and goes into the zip names, so release candidates do not share a name.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Check the tag and name the zips
        run: |
          tag="${GITHUB_REF_NAME#v}"
          base="${tag%%-*}"
          for kind in experience_economy experience_economy_resourcepack; do
            test -f "${kind}_${base}.zip" || { echo "::error::${kind}_${base}.zip not found, the tag ${GITHUB_REF_NAME} does not match the version in mcb.config.js"; exit 1; }
            test "${base}" = "${tag}" || mv "${kind}_${base}.zip" "${kind}_${tag}.zip"
          done
          if [ "${base}" = "${tag}" ]; then echo "prerelease=" >> "$GITHUB_ENV"; else echo "prerelease=--prerelease" >> "$GITHUB_ENV"; fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME"             "experience_economy_${tag}.zip"             "experience_economy_resourcepack_${tag}.zip"             --repo "$GITHUB_REPOSITORY"             --title "$GITHUB_REF_NAME"             --generate-notes $prerelease
